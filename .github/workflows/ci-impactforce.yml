name: ImpactForce - Basilisk Compilation CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/ci-impactforce.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/ci-impactforce.yml'

jobs:
  build-impactforce:
    name: Build ImpactForce simulations (Basilisk C)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc make gawk m4 curl tar \
          libglu1-mesa-dev libgl1-mesa-dev libglfw3-dev \
          libosmesa6-dev libpng-dev libnetpbm10-dev \
          ffmpeg imagemagick gnuplot

    - name: Cache Basilisk installation
      id: cache-basilisk
      uses: actions/cache@v4
      with:
        path: ~/basilisk
        key: ${{ runner.os }}-basilisk-2024-01
        restore-keys: |
          ${{ runner.os }}-basilisk-

    - name: Download and build Basilisk
      if: steps.cache-basilisk.outputs.cache-hit != 'true'
      run: |
        echo "Downloading Basilisk from basilisk.fr..."
        curl -L http://basilisk.fr/basilisk.tar.gz -o basilisk.tar.gz
        mkdir -p $HOME/basilisk
        tar -xzf basilisk.tar.gz -C $HOME/basilisk --strip-components=1

        cd $HOME/basilisk/src
        ln -sf config.gcc config

        echo "Building Basilisk..."
        make -j1

        if [ ! -f qcc ]; then
          echo "ERROR: qcc did not build"
          exit 1
        fi

        echo "Basilisk build complete"

    - name: Verify Basilisk compiler
      run: |
        export BASILISK=$HOME/basilisk/src
        export PATH=$PATH:$BASILISK
        which qcc
        qcc --version || true

    - name: Compile ImpactForce simulations
      run: |
        export BASILISK=$HOME/basilisk/src
        export PATH=$PATH:$BASILISK

        echo "Compiling Bdropimpact.c..."
        qcc -O2 -Wall Bdropimpact.c -o Bdropimpact -lm || exit 1

        echo "Compiling Jetandpressure.c..."
        qcc -O2 -Wall Jetandpressure.c -o Jetandpressure -lm || exit 1

        echo "Compilation complete."

    - name: Upload compiled binaries
      uses: actions/upload-artifact@v4
      with:
        name: impactforce-binaries
        path: |
          Bdropimpact
          Jetandpressure
        retention-days: 7
